<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OwpenGram — open-source self-hosted messenger</title>
    <meta
      name="description"
      content="OwpenGram is an open-source, self-hosted messenger that speaks the MTProto protocol. Windows, Linux and Android clients, a server you run yourself in one command, and multiple accounts on different servers in one app."
    />
    <link rel="canonical" href="https://owpengram.org/" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#08080e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)" />

    <!-- Paint the page's own background and keep the skip link off-screen from the
         first byte, so nothing flashes unstyled while the stylesheet and the app
         bundle are still on their way. The real rules live in src/style.css. -->
    <style>
      html { background: #08080e; color-scheme: dark; }
      html[data-theme='light'] { background: #f7f9fc; color-scheme: light; }
      .skip-link { position: fixed; top: 10px; left: 10px; transform: translateY(-160%); }
    </style>

    <script>
      (function () {
        var t = localStorage.getItem('owpengram-theme')
        if (!t) t = 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>

    <!-- Self-hosted so the page makes no third-party request at all: no Google
         Fonts lookup, nothing for a visitor to be tracked by, one less origin
         to block the first paint. Variable font, both subsets = 49 KB. -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OwpenGram" />
    <meta property="og:url" content="https://owpengram.org/" />
    <meta property="og:title" content="OwpenGram — open-source self-hosted messenger" />
    <meta
      property="og:description"
      content="Windows, Linux and Android clients. A server you run yourself in one command. Multiple accounts on different servers in one app. All open source."
    />
    <meta property="og:image" content="https://owpengram.org/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OwpenGram — your messenger, your server, your rules. The desktop client next to the wordmark."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OwpenGram — open-source self-hosted messenger" />
    <meta
      name="twitter:description"
      content="Windows, Linux and Android clients. A server you run yourself in one command. All open source."
    />
    <meta name="twitter:image" content="https://owpengram.org/og-card.png" />

    <!-- Static half of the structured data. The FAQ half is emitted at runtime
         from src/data.js so the two can never drift apart. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://owpengram.org/#org",
            "name": "OwpenGram",
            "url": "https://owpengram.org/",
            "logo": "https://owpengram.org/logo-1024.png",
            "sameAs": [
              "https://github.com/owpengram",
              "https://t.me/owpengram",
              "https://www.patreon.com/cw/owpengram"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://owpengram.org/#website",
            "url": "https://owpengram.org/",
            "name": "OwpenGram",
            "publisher": { "@id": "https://owpengram.org/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://owpengram.org/#app",
            "name": "OwpenGram",
            "applicationCategory": "CommunicationApplication",
            "operatingSystem": "Windows, Linux, Android",
            "url": "https://owpengram.org/",
            "downloadUrl": "https://github.com/owpengram",
            "license": "https://www.apache.org/licenses/LICENSE-2.0",
            "isAccessibleForFree": true,
            "publisher": { "@id": "https://owpengram.org/#org" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "description": "An open-source, self-hosted messenger that speaks the MTProto protocol, with Windows, Linux and Android clients and a server you run yourself."
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
