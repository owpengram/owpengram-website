<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <script>
      (function () {
        var t = localStorage.getItem('owpengram-theme')
        if (!t) t = 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>OwpenGram</title>
    <meta
      name="description"
      content="OwpenGram is an open-source, multi-server messenger with Windows and Android clients and a self-hosted server you control."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OwpenGram" />
    <meta
      property="og:description"
      content="Windows & Android clients. Self-hosted server. Multi-network accounts. Open source."
    />
    <meta property="og:image" content="/logo-1024.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
